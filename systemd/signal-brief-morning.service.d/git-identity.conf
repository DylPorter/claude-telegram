# Attribute automated signal-brief commits to a bot identity so they don't
# land on Dylan's GitHub contribution graph (an automated daily green square
# reads as botted/fake). GIT_AUTHOR_*/GIT_COMMITTER_* override git config for
# every git call in this process — including the spawned Claude subagent and
# merge commits — WITHOUT touching global git config or the "commit as me"
# rule that governs interactive work. Reversible: delete this drop-in.
[Service]
Environment=GIT_AUTHOR_NAME=signal-brief-bot
Environment=GIT_AUTHOR_EMAIL=signal-brief@users.noreply.github.com
Environment=GIT_COMMITTER_NAME=signal-brief-bot
Environment=GIT_COMMITTER_EMAIL=signal-brief@users.noreply.github.com
