# hk-events source configuration.
#
# Three tiers (see README):
#   ical_feeds   — clean .ics feeds. PREFERRED. Per-feed degrade.
#   scrape_pages — pages that SERVER-RENDER their events as structured data
#                  (schema.org JSON-LD, Next.js __NEXT_DATA__). Nearly as clean
#                  as a feed: one <script> lookup + json.loads, no CSS selectors
#                  to rot. The adapter reads its URL from here, so an entry left
#                  empty or marked TODO parks the source instead of breaking it.
#   scrape       — brittle DOM scrapers, wired in code (cyberport, startmeuphk).
#                  Listed here only for documentation; those adapters hold their
#                  own URLs.
#
# To add an iCal feed: paste the verified .ics URL under the right group.
# Entries whose url is empty or starts with "TODO" are SKIPPED by the loader,
# so an unverified feed never breaks a run.
#
# VERIFY a feed before relying on it — fetch it and confirm it returns
# text/calendar with VEVENTs:
#   curl -sL '<url>' | head -20      # should show BEGIN:VCALENDAR / VEVENT

ical_feeds:
  meetup:
    # Meetup per-group iCal: https://www.meetup.com/<slug>/events/ical/
    - name: Data Science & Generative AI Hong Kong
      # VERIFIED 2026-06-01: feed returns valid VCALENDAR (HTTP 200).
      url: https://www.meetup.com/data-science-andgenai-hk/events/ical/
    - name: vLLM Hong Kong
      # VERIFIED 2026-06-01: feed returns valid VCALENDAR (HTTP 200).
      url: https://www.meetup.com/vllm-hong-kong-meetup-group/events/ical/

  luma:
    # Luma calendar iCal pattern (VERIFIED 2026-06-01):
    #   https://api.lu.ma/ics/get?entity=calendar&id=<cal-id>
    # Find <cal-id> by curling the calendar's public page, grepping cal-XXXX,
    # then confirming X-WR-CALNAME matches the intended calendar.
    - name: Hong Kong Startup Events Calendar  # lu.ma/startupshk — 170 events @ verify
      url: https://api.lu.ma/ics/get?entity=calendar&id=cal-BQLkdX3Zkmfmu0U
    # ADDED 2026-08-09 — root cause of "the bot catches nothing". startupshk was
    # the ONLY live event source, so everything run by the Lunatechs/MooMeetup
    # crowd (CodeChella Week, Vibe Coding Day, the Atlantis MegaYacht party) was
    # invisible. Both VERIFIED 2026-08-09: X-WR-CALNAME matches, feeds return
    # VEVENTs (17 and 4 respectively).
    - name: Lunatechs Hong Kong  # lu.ma/lunatechs
      url: https://api.lu.ma/ics/get?entity=calendar&id=cal-KLdDFNfwAsFSnWE
    - name: MooMeetup  # lu.ma/moomeetup
      url: https://api.lu.ma/ics/get?entity=calendar&id=cal-KxreALPD1BHk8vP
    # lu.ma/codechella — the official CodeChella Week calendar. Returns 0 VEVENTs
    # as of 2026-08-09 because the organisers published the week as STANDALONE
    # Luma events (lu.ma/6j6b7ffj, lu.ma/wzxtnwux) rather than attaching them to
    # this calendar. Wired anyway: it costs one HTTP call and starts working the
    # moment they attach anything.
    #
    # ✅ GAP CLOSED 2026-09-01 — see scrape_pages.luma_discover below. The claim
    # that this needed Playwright was wrong: lu.ma is a Next.js app, so the city
    # page's event list is server-rendered into <script id="__NEXT_DATA__"> in
    # the initial HTML. (The other half of the old note stands: every
    # api.lu.ma/discover/* JSON endpoint really does 404.) Standalone events
    # still reach no .ics feed — they are picked up by the `luma_discover`
    # source instead, and duplicates across the two are collapsed on the Luma
    # evt- api_id (see dedupe.collapse_cross_source).
    - name: Codechella  # lu.ma/codechella
      url: https://api.lu.ma/ics/get?entity=calendar&id=cal-MZrFS0AVVLJSPpy
    # HKWeb3 (267 events) DISABLED 2026-06-02 for the initial ship: it's a
    # crypto/web3 calendar (mostly off-thesis), and classifying ~400 events on
    # the first run blew the timeout. Precision filter would drop most of it.
    # Re-enable by uncommenting if you want web3/AI-crossover rooms back.
    # - name: HKWeb3 Events Calendar  # lu.ma/hkweb3 — 267 events
    #   url: https://api.lu.ma/ics/get?entity=calendar&id=cal-5ui6MCnj5wN7WVI

  # aitinkerers has NO ical_feeds entry on purpose. CHECKED 2026-06-01 and still
  # true: the chapter site exposes no public iCal/RSS feed, only a blog-email
  # "Subscribe" widget. What was NOT true was the conclusion drawn from that —
  # the homepage publishes the same events as schema.org JSON-LD, so the source
  # is wired under scrape_pages below rather than left dead.

# Server-rendered structured-data pages. The adapter fetches exactly this URL;
# an empty value or one starting with "TODO" is treated as UNCONFIGURED, which
# the orchestrator scores as neither a success nor a failure (it prunes the
# health record) rather than as a quiet zero.
scrape_pages:
  aitinkerers:
    # VERIFIED 2026-09-01: HTTP 200 (the 403 recorded here on 2026-06-01 is
    # GONE — it now serves fine to the browser-like User-Agent the .ics adapters
    # already send). The page server-renders 9 <script type="application/ld+json">
    # blocks; two are ItemLists of full schema.org Event objects (name,
    # description, startDate, endDate, nested Place/PostalAddress, @id as the
    # event URL). 7 distinct events at time of verification, 2 of them upcoming.
    # The same blocks also carry Organization / WebSite / CollectionPage /
    # BreadcrumbList / BlogPosting / TechArticle / CreativeWork — the adapter
    # filters on @type == "Event".
    url: https://hong-kong.aitinkerers.org/

  luma_discover:
    # VERIFIED 2026-09-01: 12 upcoming HK events server-rendered inside
    # <script id="__NEXT_DATA__"> (lu.ma is Next.js — the props are in the
    # initial HTML before any JS runs). This is the ONLY way we see standalone
    # Luma events, which belong to no calendar and so appear in no .ics feed.
    #
    # ⚠️ It is lu.ma/hong-kong, NOT lu.ma/hk. `lu.ma/hk` looks like a city slug
    # and is not: it is a stale 2023 event that happens to own that slug.
    # ⚠️ Do not "improve" this to an api.lu.ma/discover/* endpoint. They all 404.
    url: https://lu.ma/hong-kong

# Brittle DOM-scrape sources (documentation only — URLs live in the adapter modules):
#   cyberport    → https://www.cyberport.hk/en/news/events/        (selectors TODO)
#   startmeuphk  → https://www.startmeup.hk/upcoming-events/events-calendar/  (selectors TODO;
#                  CHECKED 2026-06-01: ?ical=1 returns HTML not a calendar feed — no clean
#                  iCal export available, so this stays a scraper.)
#
# Clean extension points (not yet wired — add an adapter + a feed/scrape entry):
#   hktdc        → HKTDC event calendar
#   hkstp        → HK Science & Technology Parks events
#   aws_summit_hk→ AWS Summit Hong Kong

# Relevance filter keywords. The LLM classifier in classifier.py is the primary
# decision-maker; these lists feed the cheap hard-rule pass that runs before it.
# Keep them TIGHT — precision bias means a borderline title should go to the LLM
# (which itself defaults to drop), not get hard-classified here.
filter_keywords:
  hard_founder_ai:
    - hackathon
    - ai tinkerers
    - demo day
    - demo night
    - genai
    - llm
    - vllm
    - machine learning meetup
    - founders
    - founder mixer
    - pitch night
    - startup grind
  hard_drop:
    - career fair
    - job fair
    - recruitment
    - info session
    - open day
    - mlm
    - forex
    - get rich
    - passive income
    - yoga
    - wellness retreat
    - wine tasting
    - speed dating
