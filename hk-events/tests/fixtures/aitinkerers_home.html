<script type="application/ld+json">{"@context":"https://schema.org","@type":"ItemList","@id":"https://hong-kong.aitinkerers.org/#recent-talks","name":"Recent talks at AI Tinkerers Hong Kong","itemListElement":[{"@type":"ListItem","position":1,"url":"https://hong-kong.aitinkerers.org/talks/rsvp_9jqGP6qJZHg","item":{"@type":"TechArticle","@id":"https://hong-kong.aitinkerers.org/talks/rsvp_9jqGP6qJZHg#talk","url":"https://hong-kong.aitinkerers.org/talks/rsvp_9jqGP6qJZHg","headline":"Learn Anything by Doing: An Agent That Teaches, a Grader That Can't Flatter You","name":"Learn Anything by Doing: An Agent That Teaches, a Grader That Can't Flatter You","description":"Carpenter is a tool for learning by doing: you tell your AI agent what you want to master, it drafts a course outline for your approval, renders Jupyter notebooks with practice stubs and quizzes — and the second you hit Run, you get an instant, honest per-case PASS/FAIL. The agent teaches; carpenter grades. The key trust move: grading is locked to an answer key the agent can't see at grade time (lesson verify against an authored reference solution), and the grading helper is structurally verification-only — it can never print expected. A pass is a real pass, not the AI being nice to you. Live demo, two beats. Beat 1 (the main event): from \"I want to learn X\" to a graded notebook in minutes — agent drafts the plan, I approve it, a rendered notebook appears (SQLite is the source of truth; notebooks are just views), I fill in a practice stub, Run, instant feedback, then progress summary showing exactly what's done and where I'm stuck. Beat 2 (the twist, short): this tool is itself built by the same kind of loop — I'll add a command via an agent and show the build refusing to compile until the docs and tests exist. The learning tool dogfoods its own philosophy.","datePublished":"2026-08-31T10:00:00Z","isPartOf":{"@id":"https://hong-kong.aitinkerers.org/p/ai-tinkerers-hong-kong-august-meetup-with-oax-foundation-and-gmasia#event"},"publisher":{"@id":"https://aitinkerers.org/#organization"},"author":{"@type":"Person","name":"Ivan"},"about":[{"@type":"DefinedTerm","name":"Rust","url":"https://aitinkerers.org/technologies/rust"},{"@type":"DefinedTerm","name":"uv","url":"https://aitinkerers.org/technologies/uv"},{"@type":"DefinedTerm","name":"Python","url":"https://aitinkerers.org/technologies/python"},{"@type":"DefinedTerm","name":"Open Source","url":"https://aitinkerers.org/technologies/open-source"},{"@type":"DefinedTerm","name":"GitHub","url":"https://aitinkerers.org/technologies/github"}],"keywords":"Rust, uv, Python, Open Source, GitHub"}},{"@type":"ListItem","position":2,"url":"https://hong-kong.aitinkerers.org/talks/rsvp_l6qAXPd6cCk","item":{"@type":"TechArticle","@id":"https://hong-kong.aitinkerers.org/talks/rsvp_l6qAXPd6cCk#talk","url":"https://hong-kong.aitinkerers.org/talks/rsvp_l6qAXPd6cCk","headline":"How I made a corporate cybersecurity strategy using AI","name":"How I made a corporate cybersecurity strategy using AI","description":"I built an AI-assisted cybersecurity assessment framework that combines ISO 27001, IEC 62443, California SB-327, and the EU Cyber Resilience Act into a practical OT security checklist, then converts the results into a weighted maturity assessment for both the corporate environment and the BESS operational-technology environment. Demo context: The live demonstration will show the workflow used to map overlapping regulatory and technical requirements, the resulting control checklist, the weighted scoring model, and an example maturity evaluation covering the embedded controller, IoT gateway, HMI, remote-access PC, cloud services, and corporate processes. This was a knowledge-engineering and assessment project, so the main artifacts are the workflow, framework mapping, scoring methodology, and evaluation output rather than application code, repositories, or runtime logs.","datePublished":"2026-08-31T10:00:00Z","isPartOf":{"@id":"https://hong-kong.aitinkerers.org/p/ai-tinkerers-hong-kong-august-meetup-with-oax-foundation-and-gmasia#event"},"publisher":{"@id":"https://aitinkerers.org/#organization"},"author":{"@type":"Person","name":"Miguel Angel"},"about":[{"@type":"DefinedTerm","name":"OpenAI ChatGPT","url":"https://aitinkerers.org/technologies/openai-chatgpt"},{"@type":"DefinedTerm","name":"ISO/IEC 27001","url":"https://aitinkerers.org/technologies/iso-iec-27001"},{"@type":"DefinedTerm","name":"IEC 62443","url":"https://aitinkerers.org/technologies/iec-62443"},{"@type":"DefinedTerm","name":"EU Cyber Resilience Act","url":"https://aitinkerers.org/technologies/eu-cyber-resilience-act"},{"@type":"DefinedTerm","name":"Weighted maturity model","url":"https://aitinkerers.org/technologies/weighted-maturity-model"}],"keywords":"OpenAI ChatGPT, ISO/IEC 27001, IEC 62443, EU Cyber Resilience Act, Weighted maturity model"}},{"@type":"ListItem","position":3,"url":"https://hong-kong.aitinkerers.org/talks/rsvp_nk7cD0uzBpI","item":{"@type":"TechArticle","@id":"https://hong-kong.aitinkerers.org/talks/rsvp_nk7cD0uzBpI#talk","url":"https://hong-kong.aitinkerers.org/talks/rsvp_nk7cD0uzBpI","headline":"From Meow to Mastery: Building MathCat’s Adaptive Learning Platform","name":"From Meow to Mastery: Building MathCat’s Adaptive Learning Platform","description":"MathCat is an adaptive, bilingual math and science practice platform for Hong Kong primary school children, aligned to the EDB curriculum and playable as a Progressive Web App. For this demo, I’ll walk through the full stack, not just the game UI. Live, I’ll briefly show the working app (different play modes, leaderboard, rewards shop, etc); but will focus more on the backend: (1) the question-generation and validation workflow – the balance between deterministic and probabilistic models to achieve the best outcome and my learnings; (2) talk about the AI critic pipeline (Gemini + GPT-5) that scores each question template on Cantonese naturalness, HK school terminology, hint quality, and age fit (3) the adaptive progression architecture—mastery gates, recent-accuracy windows, skill unlocks, etc; (4) the overall architecture.","datePublished":"2026-08-31T10:00:00Z","isPartOf":{"@id":"https://hong-kong.aitinkerers.org/p/ai-tinkerers-hong-kong-august-meetup-with-oax-foundation-and-gmasia#event"},"publisher":{"@id":"https://aitinkerers.org/#organization"},"author":{"@type":"Person","name":"Natalia"}}},{"@type":"ListItem","position":4,"url":"https://hong-kong.aitinkerers.org/talks/rsvp_b3Uv6gyaL6c","item":{"@type":"TechArticle","@id":"https://hong-kong.aitinkerers.org/talks/rsvp_b3Uv6gyaL6c#talk","url":"https://hong-kong.aitinkerers.org/talks/rsvp_b3Uv6gyaL6c","headline":"Canto101: Learn Cantonese with Karaoke \u0026 Interactive Role-Play.","name":"Canto101: Learn Cantonese with Karaoke \u0026 Interactive Role-Play.","description":"Canto101 is a full-stack web app that makes Cantonese learning fun and culturally immersive. Instead of dry textbooks, users chat with an AI in realistic scenarios like ordering milk tea or hailing a taxi, search for Cantonese songs and tap any lyric to instantly see its Jyutping romanisation and meaning, and play vocabulary games that reinforce memory. The live demo includes the AI conversation engine, the smart dictionary with over a thousand entries, the karaoke lyric viewer, and the challenge zone. Real-time pronunciation scoring is firmly on my roadmap and I will also share my architectural blueprint for how I plan to integrate it using Azure Speech in the near future.","datePublished":"2026-07-29T10:00:00Z","isPartOf":{"@id":"https://hong-kong.aitinkerers.org/p/ai-tinkerers-hong-kong-july-meetup-wyndham-social#event"},"publisher":{"@id":"https://aitinkerers.org/#organization"},"author":{"@type":"Person","name":"Jenny"},"about":[{"@type":"DefinedTerm","name":"Gemini LLM","url":"https://aitinkerers.org/technologies/gemini-llm"},{"@type":"DefinedTerm","name":"CC-Canto","url":"https://aitinkerers.org/technologies/cc-canto"},{"@type":"DefinedTerm","name":"Zeabur","url":"https://aitinkerers.org/technologies/zeabur"},{"@type":"DefinedTerm","name":"Azure Speech Pronunciation Assessment","url":"https://aitinkerers.org/technologies/azure-speech-pronunciation-assessment"},{"@type":"DefinedTerm","name":"Azure Speech","url":"https://aitinkerers.org/technologies/azure-speech"}],"keywords":"Gemini LLM, CC-Canto, Zeabur, Azure Speech Pronunciation Assessment, Azure Speech"}},{"@type":"ListItem","position":5,"url":"https://hong-kong.aitinkerers.org/talks/rsvp_K2F2e_eF7B0","item":{"@type":"TechArticle","@id":"https://hong-kong.aitinkerers.org/talks/rsvp_K2F2e_eF7B0#talk","url":"https://hong-kong.aitinkerers.org/talks/rsvp_K2F2e_eF7B0","headline":"Beyond Leaderboards: Building the Evaluation Layer for AI","name":"Beyond Leaderboards: Building the Evaluation Layer for AI","description":"We built connected open-source infrastructure for treating AI evaluation results as reusable evidence rather than isolated scores. Every Eval Ever standardizes results from harnesses, papers, leaderboards and local runs, while Evaluation Cards combines them with model and benchmark metadata and surfaces reproducibility, completeness, provenance and comparability. The live demo will trace a result from raw output through validation and normalization into an interactive card, then reveal why apparently identical scores can disagree.","datePublished":"2026-07-29T10:00:00Z","isPartOf":{"@id":"https://hong-kong.aitinkerers.org/p/ai-tinkerers-hong-kong-july-meetup-wyndham-social#event"},"publisher":{"@id":"https://aitinkerers.org/#organization"},"author":{"@type":"Person","name":"Yanan"}}},{"@type":"ListItem","position":6,"url":"https://hong-kong.aitinkerers.org/talks/rsvp_blAbox5WGOA","item":{"@type":"TechArticle","@id":"https://hong-kong.aitinkerers.org/talks/rsvp_blAbox5WGOA#talk","url":"https://hong-kong.aitinkerers.org/talks/rsvp_blAbox5WGOA","headline":"Exploration of AI in Vision Accessibility","name":"Exploration of AI in Vision Accessibility","description":"This demo illustrates the current assistive technology landscape and a yolo-based OCR pipeline for Braille. As a student developer with severe visual impairment, James showcases sample workflows for computer use and navigation, from screen readers to vision language models, while discussing potential promising applications of AI in accessibility for the visually impaired. James also showcases a deep learning Braille-to-print transcription pipeline supporting English and Cantonese. The demo goes through the pipeline architecture, models used, training techniques addressing low-resource Braille data, and disambiguating between homophones, prevalent in Cantonese.","datePublished":"2026-06-24T10:00:00Z","isPartOf":{"@id":"https://hong-kong.aitinkerers.org/p/ai-tinkerers-hong-kong-gba-at-dialogue-in-the-dark-june#event"},"publisher":{"@id":"https://aitinkerers.org/#organization"},"author":{"@type":"Person","name":"James"},"about":[{"@type":"DefinedTerm","name":"NVDA","url":"https://aitinkerers.org/technologies/nvda"},{"@type":"DefinedTerm","name":"VoiceOver","url":"https://aitinkerers.org/technologies/voiceover"},{"@type":"DefinedTerm","name":"VLM","url":"https://aitinkerers.org/technologies/vlm"},{"@type":"DefinedTerm","name":"Gemini","url":"https://aitinkerers.org/technologies/gemini"},{"@type":"DefinedTerm","name":"OCR","url":"https://aitinkerers.org/technologies/ocr"},{"@type":"DefinedTerm","name":"Screen readers (NVDA, VoiceOver)","url":"https://aitinkerers.org/technologies/screen-readers-nvda-voiceover"},{"@type":"DefinedTerm","name":"VLMs","url":"https://aitinkerers.org/technologies/vlms"},{"@type":"DefinedTerm","name":"YOLO","url":"https://aitinkerers.org/technologies/yolo"}],"keywords":"NVDA, VoiceOver, VLM, Gemini, OCR, Screen readers (NVDA, VoiceOver), VLMs, YOLO"}},{"@type":"ListItem","position":7,"url":"https://hong-kong.aitinkerers.org/talks/rsvp_vLe9DwZ90cU","item":{"@type":"TechArticle","@id":"https://hong-kong.aitinkerers.org/talks/rsvp_vLe9DwZ90cU#talk","url":"https://hong-kong.aitinkerers.org/talks/rsvp_vLe9DwZ90cU","headline":"Hearing the Room Across Language: Building Catch’s Realtime iPhone Interpreter","name":"Hearing the Room Across Language: Building Catch’s Realtime iPhone Interpreter","description":"I've been building Catch, a native iPhone app that helps people follow talks, lectures, meetings, panels, classes, and tours in a language they do not fully understand. Catch’s current Listen Mode captures room audio, turns it into live interpreted output, plays interpreted audio through headphones when available, shows transcript text on screen as backup and saves the transcript for review afterward. I initially built Catch for myself so I could better follow conferences and presentations in Chinese. As I kept working on it, I realised that live interpretation can help people join events, talks, meetings, and community spaces they might otherwise avoid because of language barriers. For someone living in another country, or regularly moving between languages, the goal is to make participation feel more possible instead of leaving them reading, guessing, or sitting outside the conversation. Catch differs from products like Google and Apple Translate because it is specifically designed for long-form settings where you need continuous and simultaneous interpretation for extended periods of time.","datePublished":"2026-06-24T10:00:00Z","isPartOf":{"@id":"https://hong-kong.aitinkerers.org/p/ai-tinkerers-hong-kong-gba-at-dialogue-in-the-dark-june#event"},"publisher":{"@id":"https://aitinkerers.org/#organization"},"author":{"@type":"Person","name":"Alexander"},"about":[{"@type":"DefinedTerm","name":"Swift","url":"https://aitinkerers.org/technologies/swift"},{"@type":"DefinedTerm","name":"SwiftUI","url":"https://aitinkerers.org/technologies/swiftui"},{"@type":"DefinedTerm","name":"AVFoundation","url":"https://aitinkerers.org/technologies/avfoundation"},{"@type":"DefinedTerm","name":"WebSockets","url":"https://aitinkerers.org/technologies/websockets"},{"@type":"DefinedTerm","name":"AVAudioEngine","url":"https://aitinkerers.org/technologies/avaudioengine"},{"@type":"DefinedTerm","name":"AVAudioSession","url":"https://aitinkerers.org/technologies/avaudiosession"},{"@type":"DefinedTerm","name":"realtime speech interpretation APIs","url":"https://aitinkerers.org/technologies/realtime-speech-interpretation-apis"},{"@type":"DefinedTerm","name":"local iOS persistence","url":"https://aitinkerers.org/technologies/local-ios-persistence"}],"keywords":"Swift, SwiftUI, AVFoundation, WebSockets, AVAudioEngine, AVAudioSession, realtime speech interpretation APIs, local iOS persistence"}},{"@type":"ListItem","position":8,"url":"https://hong-kong.aitinkerers.org/talks/rsvp_5Setv57KQwQ","item":{"@type":"TechArticle","@id":"https://hong-kong.aitinkerers.org/talks/rsvp_5Setv57KQwQ#talk","url":"https://hong-kong.aitinkerers.org/talks/rsvp_5Setv57KQwQ","headline":"Building Graph Navigation Tool for the Visually Impaired","name":"Building Graph Navigation Tool for the Visually Impaired","description":"Access8Graph, a keyboard-input, speech-output system that allows screen reader users navigate complex graph data — starting with Taipei Metro System. The tool parses GraphML files (a common visual graph format), extracts semantic relationships that visual editors often ignore, and provides three distinct navigation modes matched to different user mental models — directional navigation, linear exploration, and route planning.","datePublished":"2026-06-24T10:00:00Z","isPartOf":{"@id":"https://hong-kong.aitinkerers.org/p/ai-tinkerers-hong-kong-gba-at-dialogue-in-the-dark-june#event"},"publisher":{"@id":"https://aitinkerers.org/#organization"},"author":{"@type":"Person","name":"Beta"},"about":[{"@type":"DefinedTerm","name":"GraphML","url":"https://aitinkerers.org/technologies/graphml"},{"@type":"DefinedTerm","name":"yEd","url":"https://aitin
